services:
  paisa-postgres:
    ports:
      - "127.0.0.1:${PAISA_LOCAL_DB_PORT:-5243}:5432"
    volumes:
      - paisa-local-postgres:/var/lib/postgresql/data
  paisa-api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${PAISA_LOCAL_API_PORT:-8081}:8080"
  paisa-web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${PAISA_LOCAL_WEB_PORT:-5174}:80"

volumes:
  paisa-local-postgres:
