services:
  paisa-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${PAISA_POSTGRES_DB:-project}
      POSTGRES_USER: ${PAISA_POSTGRES_USER:-project}
      POSTGRES_PASSWORD: ${PAISA_POSTGRES_PASSWORD:?PAISA_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  paisa-api:
    image: ${PAISA_API_IMAGE:-paisa-api:local}
    depends_on:
      paisa-postgres:
        condition: service_healthy
    environment:
      PAISA_POSTGRES_HOST: paisa-postgres
      PAISA_POSTGRES_PORT: 5432
      PAISA_POSTGRES_DB: ${PAISA_POSTGRES_DB:-project}
      PAISA_POSTGRES_USER: ${PAISA_POSTGRES_USER:-project}
      PAISA_POSTGRES_PASSWORD: ${PAISA_POSTGRES_PASSWORD}
      PAISA_POSTGRES_SSLMODE: disable
      PAISA_INTERNAL_ADMIN_TOKEN: ${PAISA_INTERNAL_ADMIN_TOKEN:?PAISA_INTERNAL_ADMIN_TOKEN is required}
      PAISA_HTTP_ADDR: 0.0.0.0:8080
      PAISA_SCHEMA_PATH: /app/db/schema.sql
      PAISA_ALLOWED_ORIGINS: ${PAISA_ALLOWED_ORIGINS:?PAISA_ALLOWED_ORIGINS is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  paisa-web:
    image: ${PAISA_WEB_IMAGE:-paisa-web:local}
    environment:
      PAISA_PUBLIC_API_URL: ${PAISA_PUBLIC_API_URL:?PAISA_PUBLIC_API_URL is required}
    depends_on:
      paisa-api:
        condition: service_healthy
