services:
  paisa-postgres:
    volumes:
      - paisa-staging-postgres:/var/lib/postgresql/data
  paisa-api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${PAISA_STAGING_API_PORT:-18081}:8080"
  paisa-web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${PAISA_STAGING_WEB_PORT:-15174}:80"

volumes:
  paisa-staging-postgres:
